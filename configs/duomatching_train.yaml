generator_ckpt: ${oc.env:DUOMATCHING_INIT_CKPT,checkpoints/framewise/causal_cd.pt}
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list: [1000, 500]
denoising_step_list_first_chunk: [1000, 750, 500, 250]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 6347671
wandb_host: https://api.wandb.ai
wandb_key: null
wandb_entity: null
wandb_project: duomatching
sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 8
max_train_steps: 1800
log_iters: 60
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape: [1, 21, 16, 60, 104]
distribution_loss: dmd
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 1
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
data_path: ${oc.env:DUOMATCHING_TRAIN_PROMPTS,prompts/vidprom_filtered_extended.txt}
gradient_accumulation_steps: 8
log_inference: true
log_inference_prompt_path: prompts/demos.txt
log_inference_num_output_frames: 21
log_inference_wandb_max_videos: 3
qwen_image_teacher:
  enabled: true
  model_path: ${oc.env:DUOMATCHING_QWEN_ROOT,models/Qwen-Image}
  fsdp_wrap_strategy: size
  # Qwen is frozen and only used under no_grad, so CPU-offloading it avoids
  # competing with the trainable critics for persistent GPU memory.
  cpu_offload: true
  # A separate Wan-1.3B fake critic learns only the adapter-space F=1
  # generator marginal under the same dynamic sigma schedule as Qwen Image.
  train_fake_critic: true
  fake_model_name: Wan2.1-T2V-1.3B
  fake_critic_fsdp_wrap_strategy: size
  fake_critic_cpu_offload: false
  fake_critic_lr: 4.0e-07
  fake_critic_loss_weight: 1.0
  # Randomly sample one frame from each temporal segment separated by strong
  # transitions in the video latent sequence.
  frames_per_video: 4
  frame_sampling: transition_segments
  include_first_frame: random
  latent_adapter: frame_latent_adapter
  adapter_model_path: ${oc.env:DUOMATCHING_ADAPTER_ROOT,checkpoints/DuoMatching/latent_bridge}
  loss_weight: 0.4
  warmup_steps: 60
  guidance_scale: 4.0
  negative_prompt: " "
  timestep_sampling: random
  timestep_schedule: qwen_dynamic
  scheduler_reference_steps: 50
  max_sequence_length: 512
